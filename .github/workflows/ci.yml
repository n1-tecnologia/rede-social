# The one `checks` definition of the pipeline. It mirrors the root `verify` script (package.json,
# plan 02-16) step for step: lint (Biome + the UI literal guard), typecheck/build/unit, the
# build-output gate, module boundaries, lane guard, pgTAP, API integration, the pooler spike, the
# dev-server e2e (iPhone 14, Pixel 7, desktop) and the production-build PWA e2e. Add a step here only
# when `verify` gains one, in the same position. `verify` itself still runs the WHOLE e2e locally;
# CI does not run the dev-server e2e at all (below).
#
# Jobs: `static`, `db`, `plan`, `e2e`, `e2e-pwa`. The `verify` order is kept inside each job, and a
# caller succeeds only when every job that ran succeeds (skipped jobs do not block). The dev-server
# e2e (`plan` + `e2e`) runs ONLY from e2e-full.yml, by hand: it takes 25-30 minutes and is flaky, so
# at the user's request it is not part of any push or pull request gate.
# - `static`: lint, typecheck/build/unit, the build-output gate, boundaries and the lane guard.
# - `db`: its own local stack, pgTAP, the seed, the API integration suite and the pooler spike.
# - `plan`: no stack, no install. Decides which dev-server e2e specs the change can affect
#   (apps/web/scripts/e2e-affected.ts + apps/web/e2e/affected-map.json): none, some or all.
# - `e2e`: fed by `plan`. `none` skips it, `some` runs ONE job with only the chosen specs, `all` runs
#   the usual four shards (`--shard=N/4`), each with its own local stack, reset, role, env and seed.
# - `e2e-pwa`: its own local stack and seed, then the production-build PWA run. Runs in the gate.
#
# Callers (symmetric, D-01): deploy-api.yml (push to master) and deploy-hml.yml (push to homolog)
# each run this file as their `checks` job for the exact sha they are about to deploy, and their
# deploy job `needs` it. This file has NO push trigger of its own, so a push never runs the suite
# twice. Pull requests run it directly. e2e-full.yml is a manual run: it passes `suite: e2e-full`,
# which runs only `plan` (forced to `all`) and `e2e`, every spec in four shards. There is no
# scheduled run (D-04). Rules, runbook and limits: docs/deploy/ci.md.
#
# Composite actions (lifting the 08-02 "no composite" decision): 08-02 left four verbatim copies of
# the local-stack bring-up because nothing else needed to share them. Now the `e2e` job is a single
# matrix definition, the Docker rate-limit retry (D-05) must exist exactly once, and a drifted copy
# would defeat the manual full run (D-04). So `.github/actions/setup-workspace` holds pnpm + Node +
# install, and `.github/actions/local-stack` holds the bring-up used by `db`, `e2e` and `e2e-pwa`.
name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      suite:
        description: "checks (default) runs every job; e2e-full runs only plan + e2e, every spec, 4 shards"
        type: string
        default: checks

permissions:
  contents: read

env:
  # Local-stack-only credentials: the Supabase instance lives and dies inside each runner.
  # Real environments get these from GitHub environment secrets (see docs/DEPLOY.md).
  # The runner never reaches a real provider: scripts/local-env.sh writes MAIL_TRANSPORT=local,
  # DOMAIN_PROVIDER=fake and AUTH_ALLOW_LIST=local, and no hosted secret is declared here
  # (fork pull requests receive none either — plain `pull_request`, never `pull_request_target`).
  # They are declared ONLY here: the composite actions inherit this job environment.
  SEED_PASSWORD: ci-only-Segredo123
  SUPER_ADMIN_PASSWORD: ci-only-SuperSegredo123
  SUPER_ADMIN_EMAIL: superadmin@rede-social.test
  # Send Email Hook secret, ci-only: the stack start, `db reset` and `test db` run the setup-cli
  # binary directly (scripts/supabase.sh does not apply), every CLI command validates the
  # `[auth.hook.send_email]` block, and scripts/local-env.sh writes this exported value into
  # .env.local so GoTrue and the API share it. Real environments: docs/deploy/auth-mail.md.
  SEND_EMAIL_HOOK_SECRETS: v1,whsec_Y2ktb25seS1zZW5kLWVtYWlsLWhvb2stc2VjcmV0LTAwMDE=

# Concurrency is job-level, one group per job (and per shard), so jobs of ONE run never cancel one
# another, while a newer run of the same ref cancels the older run's matching job. The group names
# the job id literally: `github.job` is set by the runner for steps only and is empty when a
# job-level `concurrency` is evaluated, so a group built on it would be the same for every job.
# `github.workflow` keeps a direct run apart from each caller (Deploy API, Deploy homolog, E2E full).
jobs:
  static:
    name: lint, typecheck, build gate, unit tests, boundaries, lane guard
    if: ${{ inputs.suite != 'e2e-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-static
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # The root script, not the bare turbo task: this is what makes scripts/check-ui-literals.sh
      # (UI-03 / PWA-03) run in CI.
      - name: Lint (Biome + UI literal guard)
        run: pnpm lint
      # apps/web/lib/env.ts validates at `next build` time, and this job has no local stack (no
      # apps/web/.env.local). These are the local-stack defaults — public values that only satisfy
      # validation; nothing is reached during the build.
      - name: Typecheck, build, unit tests
        run: pnpm turbo typecheck build test
        env:
          API_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          # 07-07: a LOCAL-ONLY test VAPID public key (private half discarded; CI push is fake).
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BJHs89NeHI8M9hJQWfvb1_irumrdO-cNFTwQZUHrWx3Lp3smi-NAifeRu5Pm4rWfwmQCL5GvEdK8_PVtNafxV1k
      # ROADMAP Phase 2 criterion 1 build-output gate: no authenticated or host-branded route is static.
      - name: "Build output: no authenticated route is static"
        run: pnpm check:static-routes

      - name: Module boundaries
        run: pnpm boundaries
      - name: Module boundaries (negative fixture must fail)
        run: pnpm boundaries:negative
      - name: Lane guard (no non-LOCAL role switch or session-scoped claims)
        run: pnpm guard:lanes

  db:
    name: pgTAP, seed, API integration, pooler spike
    if: ${{ inputs.suite != 'e2e-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-db
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # Stack, reset, role, Realtime wait, pgTAP, env files, seed - in `verify`'s order.
      - uses: ./.github/actions/local-stack
        with:
          pgtap: 'true'

      - name: API integration suite
        run: pnpm test:integration
      - name: Pooler lane spike (local contingency port; staging proof is plan 01-12)
        run: pnpm spike:supavisor

  # Which dev-server e2e specs can this change affect? No stack, no install: the selector is a plain
  # `node` script over `git diff`, so it needs history (fetch-depth 0). Every github.* / inputs.*
  # value reaches the shell through `env:` only. A pull request diffs against its base sha; a push
  # against `github.event.before`; every other event, and every doubt, resolves to `all`.
  plan:
    name: plan (which e2e specs does this change affect?)
    if: ${{ inputs.suite == 'e2e-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-plan
      cancel-in-progress: true
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      specs: ${{ steps.plan.outputs.specs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select the e2e specs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          SUITE: ${{ inputs.suite }}
        run: |
          args=(--event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$SUITE" = "e2e-full" ]; then
            args+=(--force-all)
          fi
          node apps/web/scripts/e2e-affected.ts "${args[@]}"

  e2e:
    name: e2e ${{ needs.plan.outputs.mode }} ${{ matrix.shard }}/${{ matrix.total }} (iPhone 14, Pixel 7, desktop - dev servers)
    needs: plan
    if: ${{ inputs.suite == 'e2e-full' && needs.plan.outputs.mode != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One red shard must not cancel the others: the run reports every shard's failures.
      fail-fast: false
      # all => four shards of four; some => one entry (shard 1 of 1); none => one inert entry that
      # only has to parse, the `if` above skips it.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-e2e-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/local-stack

      - name: Install Chromium for Playwright
        run: pnpm --filter @rede-social/web exec playwright install --with-deps chromium
      # `pnpm e2e` is `playwright test` in apps/web. Mode `all` splits the spec files with `--shard`;
      # mode `some` runs the chosen specs, as `e2e/<name>.spec.ts` paths (Playwright treats a
      # positional argument as a regex over the path, and the directory prefix keeps `members.spec.ts`
      # from also selecting `admin-members.spec.ts`).
      - name: End-to-end ${{ matrix.shard }}/${{ matrix.total }} (iPhone 14, Pixel 7, desktop - dev servers)
        env:
          E2E_MODE: ${{ needs.plan.outputs.mode }}
          E2E_SPECS: ${{ needs.plan.outputs.specs }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          # Per-shard folders so one shard's report never overwrites another's.
          PLAYWRIGHT_REPORT_DIR: playwright-report-shard-${{ matrix.shard }}
          PLAYWRIGHT_OUTPUT_DIR: test-results-shard-${{ matrix.shard }}
        run: |
          if [ "$E2E_MODE" = "all" ]; then
            pnpm --filter @rede-social/web exec playwright test --shard="$SHARD/$TOTAL"
          else
            if [ -z "$E2E_SPECS" ]; then
              echo "::error::mode $E2E_MODE but the plan selected no spec"
              exit 1
            fi
            # Unquoted on purpose: the list is space-separated spec paths, the names carry no
            # whitespace, and a Vitest guard (apps/web/scripts/e2e-affected.test.ts) enforces it.
            # shellcheck disable=SC2086
            pnpm --filter @rede-social/web exec playwright test $E2E_SPECS
          fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report-shard-${{ matrix.shard }}
            apps/web/test-results-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7

  e2e-pwa:
    name: e2e PWA (production build — iPhone 14, Pixel 7, desktop)
    if: ${{ inputs.suite != 'e2e-full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-e2e-pwa
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: ./.github/actions/local-stack

      - name: Install Chromium for Playwright
        run: pnpm --filter @rede-social/web exec playwright install --with-deps chromium
      # Production build required: `@serwist/turbopack` empties the precache in `next dev` (02-11).
      # playwright.pwa.config.ts builds and starts the app on port 3100 and inherits the base
      # config's report knobs, so this run keeps its own report/trace folders.
      - name: End-to-end PWA (production build — iPhone 14, Pixel 7, desktop)
        run: pnpm --filter @rede-social/web e2e:pwa
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report-pwa
          PLAYWRIGHT_OUTPUT_DIR: test-results-pwa

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-pwa
          path: |
            apps/web/playwright-report-pwa
            apps/web/test-results-pwa
          if-no-files-found: ignore
          retention-days: 7
