# Mirrors the root `verify` script (package.json, plan 02-16) step for step: lint (Biome + the UI
# literal guard), typecheck/build/unit, the build-output gate, module boundaries, lane guard, pgTAP,
# API integration, the pooler spike, the dev-server e2e (iPhone 14, Pixel 7, desktop) and the
# production-build PWA e2e. `workflow_call` makes this same file the `checks` job of deploy-api.yml,
# so the production gate runs the identical checks for the exact `master` SHA it is about to deploy —
# there is never a second, drifting copy of these steps (D-12). Add a step here only when the
# `verify` script gains one, in the same position.
#
# 08-02 (D-348): the steps are split into four jobs, so each one fits a 60-minute limit. The single
# `checks` job could not: its e2e stage alone took 49.8 minutes single-worker in 07-15 (788 tests).
# - `static`: lint, typecheck/build/unit, the build-output gate, boundaries and the lane guard.
# - `db`: its own local stack, pgTAP, the seed, the API integration suite and the pooler spike.
# - `e2e`: four shards (`--shard=N/4`), each with its own local stack, reset, role, env and seed.
#   Shard N runs about a quarter of the suite (about 13 minutes) plus the stack start.
# - `e2e-pwa`: its own local stack and seed, then the production-build PWA run.
# The `verify` order is kept inside each job. A caller of this workflow (deploy-api.yml `checks`)
# succeeds only when every job here succeeds, so the production gate still waits on all of them.
# The local-stack bring-up is repeated verbatim per job: GitHub Actions has no way to splice a list
# of steps into another job without a composite action, and none is added (08-02).
name: CI

on:
  pull_request:
  # `master` is absent on purpose: a push there already runs this file as the `checks` job of
  # deploy-api.yml (workflow_call), so listing it here ran the whole suite twice per push.
  push:
    branches: [homolog]
  workflow_call: {}

permissions:
  contents: read

env:
  # Local-stack-only credentials: the Supabase instance lives and dies inside each runner.
  # Real environments get these from GitHub environment secrets (see docs/DEPLOY.md).
  # The runner never reaches a real provider: scripts/local-env.sh writes MAIL_TRANSPORT=local,
  # DOMAIN_PROVIDER=fake and AUTH_ALLOW_LIST=local, and no hosted secret is declared here
  # (fork pull requests receive none either — plain `pull_request`, never `pull_request_target`).
  SEED_PASSWORD: ci-only-Segredo123
  SUPER_ADMIN_PASSWORD: ci-only-SuperSegredo123
  SUPER_ADMIN_EMAIL: superadmin@rede-social.test
  # Send Email Hook secret, ci-only: the stack start, `db reset` and `test db` below run the
  # setup-cli binary directly (scripts/supabase.sh does not apply), every CLI command validates the
  # `[auth.hook.send_email]` block, and scripts/local-env.sh writes this exported value into
  # .env.local so GoTrue and the API share it. Real environments: docs/deploy/auth-mail.md.
  SEND_EMAIL_HOOK_SECRETS: v1,whsec_Y2ktb25seS1zZW5kLWVtYWlsLWhvb2stc2VjcmV0LTAwMDE=

# Concurrency is job-level, one group per job (and per shard), so jobs of ONE run never cancel one
# another, while a newer run of the same ref cancels the older run's matching job. The group names
# the job id literally: `github.job` is set by the runner for steps only and is empty when a
# job-level `concurrency` is evaluated, so a group built on it would be the same for every job.
# `github.workflow` keeps a direct run apart from the deploy-api.yml call.
jobs:
  static:
    name: lint, typecheck, build gate, unit tests, boundaries, lane guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-static
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The root script, not the bare turbo task: this is what makes scripts/check-ui-literals.sh
      # (UI-03 / PWA-03) run in CI.
      - name: Lint (Biome + UI literal guard)
        run: pnpm lint
      # apps/web/lib/env.ts validates at `next build` time, and this job has no local stack (no
      # apps/web/.env.local). These are the local-stack defaults — public values that only satisfy
      # validation; nothing is reached during the build.
      - name: Typecheck, build, unit tests
        run: pnpm turbo typecheck build test
        env:
          API_URL: http://127.0.0.1:8787
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder
          # 07-07: a LOCAL-ONLY test VAPID public key (private half discarded; CI push is fake).
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: BJHs89NeHI8M9hJQWfvb1_irumrdO-cNFTwQZUHrWx3Lp3smi-NAifeRu5Pm4rWfwmQCL5GvEdK8_PVtNafxV1k
      # ROADMAP Phase 2 criterion 1 build-output gate: no authenticated or host-branded route is static.
      - name: "Build output: no authenticated route is static"
        run: pnpm check:static-routes

      - name: Module boundaries
        run: pnpm boundaries
      - name: Module boundaries (negative fixture must fail)
        run: pnpm boundaries:negative
      - name: Lane guard (no non-LOCAL role switch or session-scoped claims)
        run: pnpm guard:lanes

  db:
    name: pgTAP, seed, API integration, pooler spike
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-db
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Generate ES256 signing keys for the local stack
        # The CLI loads config.toml first, and `signing_keys_path` must already hold valid JSON, so seed
        # an empty set; the CLI then appends the new key to that file itself (no stdout redirect — a
        # `>` onto the same path empties it before the CLI reads it).
        run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --yes
      - name: Start the local Supabase stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Give api_user a local login password
        run: bash scripts/db-local-role.sh

      - name: Wait for Realtime's partition of today (pgTAP 150/152 fail without it)
        # 07 review A-WR-06: the Realtime authorization facts need a `realtime.messages` partition that
        # covers now(), and only the Realtime service (its owner) creates one. Wait for it instead of
        # letting a cold stack race the suite; the facts fail, never skip, when it is missing.
        run: |
          for _ in $(seq 1 60); do
            found=$(psql "postgres://postgres:postgres@127.0.0.1:54322/postgres" -Atc "select count(*) from pg_inherits i join pg_class c on c.oid = i.inhrelid where i.inhparent = 'realtime.messages'::regclass and pg_get_expr(c.relpartbound, c.oid) like '%FROM (''' || to_char(date_trunc('day', now() at time zone 'utc'), 'YYYY-MM-DD HH24:MI:SS') || ''')%'")
            if [ "$found" != "0" ]; then exit 0; fi
            sleep 2
          done
          echo "no realtime.messages partition covers now() after 120 s"
          exit 1
      - name: pgTAP (RLS and tenant isolation)
        run: supabase test db

      - name: Write .env.local for the API and the web app
        run: bash scripts/local-env.sh > apps/api/.env.local && bash scripts/local-env.sh > apps/web/.env.local
      - name: Seed the two tenants
        run: pnpm db:seed

      - name: API integration suite
        run: pnpm test:integration
      - name: Pooler lane spike (local contingency port; staging proof is plan 01-12)
        run: pnpm spike:supavisor

  e2e:
    name: e2e shard ${{ matrix.shard }}/4 (iPhone 14, Pixel 7, desktop — dev servers)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One red shard must not cancel the others: the run reports every shard's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-e2e-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Generate ES256 signing keys for the local stack
        # Same as the db job: seed an empty set, the CLI appends the key itself.
        run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --yes
      - name: Start the local Supabase stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Give api_user a local login password
        run: bash scripts/db-local-role.sh

      - name: Wait for Realtime's partition of today (the notification and chat specs need it)
        # Same wait as the db job (07 review A-WR-06): a cold stack has no `realtime.messages`
        # partition for now() until the Realtime service creates one.
        run: |
          for _ in $(seq 1 60); do
            found=$(psql "postgres://postgres:postgres@127.0.0.1:54322/postgres" -Atc "select count(*) from pg_inherits i join pg_class c on c.oid = i.inhrelid where i.inhparent = 'realtime.messages'::regclass and pg_get_expr(c.relpartbound, c.oid) like '%FROM (''' || to_char(date_trunc('day', now() at time zone 'utc'), 'YYYY-MM-DD HH24:MI:SS') || ''')%'")
            if [ "$found" != "0" ]; then exit 0; fi
            sleep 2
          done
          echo "no realtime.messages partition covers now() after 120 s"
          exit 1

      - name: Write .env.local for the API and the web app
        run: bash scripts/local-env.sh > apps/api/.env.local && bash scripts/local-env.sh > apps/web/.env.local
      - name: Seed the two tenants
        run: pnpm db:seed

      - name: Install Chromium for Playwright
        run: pnpm --filter @rede-social/web exec playwright install --with-deps chromium
      # `pnpm e2e` is `playwright test` in apps/web; the shard flag splits the spec files four ways.
      - name: End-to-end shard ${{ matrix.shard }}/4 (iPhone 14, Pixel 7, desktop — dev servers)
        run: pnpm --filter @rede-social/web exec playwright test --shard=${{ matrix.shard }}/4
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report-shard-${{ matrix.shard }}
          PLAYWRIGHT_OUTPUT_DIR: test-results-shard-${{ matrix.shard }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report-shard-${{ matrix.shard }}
            apps/web/test-results-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 7

  e2e-pwa:
    name: e2e PWA (production build — iPhone 14, Pixel 7, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}-e2e-pwa
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Generate ES256 signing keys for the local stack
        # Same as the db job: seed an empty set, the CLI appends the key itself.
        run: echo '[]' > supabase/signing_keys.json && supabase gen signing-key --algorithm ES256 --yes
      - name: Start the local Supabase stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Give api_user a local login password
        run: bash scripts/db-local-role.sh

      - name: Wait for Realtime's partition of today (the signed-in shell subscribes)
        # Same wait as the db job (07 review A-WR-06).
        run: |
          for _ in $(seq 1 60); do
            found=$(psql "postgres://postgres:postgres@127.0.0.1:54322/postgres" -Atc "select count(*) from pg_inherits i join pg_class c on c.oid = i.inhrelid where i.inhparent = 'realtime.messages'::regclass and pg_get_expr(c.relpartbound, c.oid) like '%FROM (''' || to_char(date_trunc('day', now() at time zone 'utc'), 'YYYY-MM-DD HH24:MI:SS') || ''')%'")
            if [ "$found" != "0" ]; then exit 0; fi
            sleep 2
          done
          echo "no realtime.messages partition covers now() after 120 s"
          exit 1

      - name: Write .env.local for the API and the web app
        run: bash scripts/local-env.sh > apps/api/.env.local && bash scripts/local-env.sh > apps/web/.env.local
      - name: Seed the two tenants
        run: pnpm db:seed

      - name: Install Chromium for Playwright
        run: pnpm --filter @rede-social/web exec playwright install --with-deps chromium
      # Production build required: `@serwist/turbopack` empties the precache in `next dev` (02-11).
      # playwright.pwa.config.ts builds and starts the app on port 3100 and inherits the base
      # config's report knobs, so this run keeps its own report/trace folders.
      - name: End-to-end PWA (production build — iPhone 14, Pixel 7, desktop)
        run: pnpm --filter @rede-social/web e2e:pwa
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report-pwa
          PLAYWRIGHT_OUTPUT_DIR: test-results-pwa

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts-pwa
          path: |
            apps/web/playwright-report-pwa
            apps/web/test-results-pwa
          if-no-files-found: ignore
          retention-days: 7
