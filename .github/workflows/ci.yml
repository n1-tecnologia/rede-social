# Mirrors the root `verify` script (package.json, plan 02-16) step for step: lint (Biome + the UI
# literal guard), typecheck/build/unit, the build-output gate, module boundaries, lane guard, pgTAP,
# API integration, the pooler spike, the dev-server e2e (iPhone 14, Pixel 7, desktop) and the
# production-build PWA e2e. `workflow_call` makes this same file the `checks` job of deploy-api.yml,
# so the production gate runs the identical checks for the exact `main` SHA it is about to deploy —
# there is never a second, drifting copy of these steps (D-12). Add a step here only when the
# `verify` script gains one, in the same position.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, build gate, tests, pgTAP, integration, e2e, PWA e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level so the group is the same whether this file runs directly or is called by
    # deploy-api.yml; `github.workflow` keeps the two groups apart.
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      # Local-stack-only credentials: the Supabase instance lives and dies inside this runner.
      # Real environments get these from GitHub environment secrets (see docs/DEPLOY.md).
      # The runner never reaches a real provider: scripts/local-env.sh writes MAIL_TRANSPORT=local,
      # DOMAIN_PROVIDER=fake and AUTH_ALLOW_LIST=local, and no hosted secret is declared here
      # (fork pull requests receive none either — plain `pull_request`, never `pull_request_target`).
      SEED_PASSWORD: ci-only-Segredo123
      SUPER_ADMIN_PASSWORD: ci-only-SuperSegredo123
      SUPER_ADMIN_EMAIL: superadmin@rede-social.test
      # Send Email Hook secret, ci-only: `supabase start`/`db reset`/`test db` below run the setup-cli
      # binary directly (scripts/supabase.sh does not apply), every CLI command validates the
      # `[auth.hook.send_email]` block, and scripts/local-env.sh writes this exported value into
      # .env.local so GoTrue and the API share it. Real environments: docs/deploy/auth-mail.md.
      SEND_EMAIL_HOOK_SECRETS: v1,whsec_Y2ktb25seS1zZW5kLWVtYWlsLWhvb2stc2VjcmV0LTAwMDE=
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The root script, not the bare turbo task: this is what makes scripts/check-ui-literals.sh
      # (UI-03 / PWA-03) run in CI.
      - name: Lint (Biome + UI literal guard)
        run: pnpm lint
      - name: Typecheck, build, unit tests
        run: pnpm turbo typecheck build test
      # ROADMAP Phase 2 criterion 1 build-output gate: no authenticated or host-branded route is static.
      - name: "Build output: no authenticated route is static"
        run: pnpm check:static-routes

      - name: Module boundaries
        run: pnpm boundaries
      - name: Module boundaries (negative fixture must fail)
        run: pnpm boundaries:negative
      - name: Lane guard (no non-LOCAL role switch or session-scoped claims)
        run: pnpm guard:lanes

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Generate ES256 signing keys for the local stack
        run: supabase gen signing-key --algorithm ES256 -o json > supabase/signing_keys.json
      - name: Start the local Supabase stack
        run: supabase start
      - name: Apply migrations
        run: supabase db reset
      - name: Give api_user a local login password
        run: bash scripts/db-local-role.sh

      - name: pgTAP (RLS and tenant isolation)
        run: supabase test db

      - name: Write .env.local for the API and the web app
        run: bash scripts/local-env.sh > apps/api/.env.local && bash scripts/local-env.sh > apps/web/.env.local
      - name: Seed the two tenants
        run: pnpm db:seed

      - name: API integration suite
        run: pnpm test:integration
      - name: Pooler lane spike (local contingency port; staging proof is plan 01-12)
        run: pnpm spike:supavisor

      - name: Install Chromium for Playwright
        run: pnpm --filter @rede-social/web exec playwright install --with-deps chromium
      - name: End-to-end (iPhone 14, Pixel 7, desktop — dev servers)
        run: pnpm e2e
      # Production build required: `@serwist/turbopack` empties the precache in `next dev` (02-11).
      # playwright.pwa.config.ts builds and starts the app on port 3100 and inherits the base
      # config's report knobs, so the two Playwright runs keep separate report/trace folders.
      - name: End-to-end PWA (production build — iPhone 14, Pixel 7, desktop)
        run: pnpm --filter @rede-social/web e2e:pwa
        env:
          PLAYWRIGHT_REPORT_DIR: playwright-report-pwa
          PLAYWRIGHT_OUTPUT_DIR: test-results-pwa

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-pwa
            apps/web/test-results
            apps/web/test-results-pwa
          if-no-files-found: ignore
          retention-days: 7
