# Production seeding is MANUAL and only manual (D-14). The production deploy job never seeds, so the
# pilot tenants and the super_admin are created exactly once, deliberately, by a human.
name: Seed production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    name: pnpm db:seed against rede-social-prod
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Seed (idempotent — safe to re-run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          SUPER_ADMIN_EMAIL: ${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          PLATFORM_HOST: ${{ vars.PLATFORM_HOST }}
          TENANT_DEMO_HOST: ${{ vars.TENANT_DEMO_HOST }}
          TENANT_LAB_HOST: ${{ vars.TENANT_LAB_HOST }}
        run: pnpm db:seed
