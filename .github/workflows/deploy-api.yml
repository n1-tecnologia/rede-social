# API + worker to Cloud Run (D-11, D-12, D-15). One image, two Cloud Run services (D-18).
#
# Production only: there is no staging project and no staging services (docs/DEPLOY.md
# "Decisions (2026-09-28)"). Pull requests run ci.yml only; the web Preview comes from Vercel's
# Git integration.
#
#   push to master -> `checks` (the reusable ci.yml for THIS sha) + build, then
#                     `migrate-and-deploy-prod` behind the `production` GitHub Environment
#                     (a required reviewer) in the order migrations -> API -> worker.
#
# A direct admin push to `master` cannot skip the gate: the production job needs both `checks` and
# `build`, so branch protection is a convenience, not the safety mechanism.
name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - apps/api/**
      - packages/**
      - supabase/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml

permissions:
  contents: read
  id-token: write

# Never cancel: a cancelled run could abort a migration halfway. Two pushes to master queue instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_REGION: southamerica-east1
  AR_REPO: rede-social

jobs:
  # Pull requests run ci.yml on their own; this job re-runs the same file for the exact `master`
  # SHA that feeds the production gate.
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compute the image reference
        id: image
        run: echo "ref=${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fallback if the GitHub plan blocks protected environments on a private repo (RESEARCH §Pitfall 5,
  # Open Question 1): delete the `environment:` block below and replace the `push` trigger for this
  # job with a manual dispatch — the manual run IS the approval. Keep `needs: [checks, build]`.
  #   on:
  #     workflow_dispatch:
  #       inputs:
  #         sha: { description: "master SHA to deploy", required: true }
  migrate-and-deploy-prod:
    name: Production (migrations -> API -> worker)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rede-social-woad.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Migrations (roles included)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-roles

      - name: Set the api_user password
        env:
          PGPASSWORD_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
        run: psql "$PGPASSWORD_URL" -v ON_ERROR_STOP=1 -v pw="$API_DB_PASSWORD" -c "alter role api_user with login password :'pw'"

      - name: Push auth/SMTP configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: supabase config push

      # No seeding here, ever — production holds only the super_admin, created once by hand on
      # 2026-09-28; never run `pnpm db:seed` against production (it creates the demo tenants). See
      # docs/DEPLOY.md "Decisions (2026-09-28)".

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/deploy-cloudrun@v3
        id: api
        with:
          service: api
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=api
            LOG_LEVEL=info
          secrets: |-
            DATABASE_URL=api-database-url-prod:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest
            SUPABASE_URL=supabase-url-prod:latest
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=1 --allow-unauthenticated --port=8080

      - uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: worker
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=worker
            LOG_LEVEL=info
          secrets: |-
            DATABASE_URL=api-database-url-prod:latest
            BOSS_DATABASE_URL=worker-database-url-prod:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest
            SUPABASE_URL=supabase-url-prod:latest
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=1 --no-cpu-throttling --no-allow-unauthenticated

      - name: Deep health check
        run: curl -fsS "${{ steps.api.outputs.url }}/v1/health?deep=1"
