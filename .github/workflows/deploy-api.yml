# API + worker to Cloud Run (D-11, D-12, D-15). One image, two Cloud Run services (D-18).
#
# This workflow is production. Homolog (hml) is a separate, isolated environment (its own GCP,
# Supabase and Vercel projects) deployed by deploy-hml.yml from the `homolog` branch (docs/DEPLOY.md
# "Decisions (2026-10-02)"), through the SAME `checks`. Pull requests run ci.yml directly; the web
# Preview comes from Vercel's Git integration.
#
#   push to master (the `paths` below) -> this workflow only: ci.yml has no push trigger of its own,
#                     so nothing runs twice. `checks` is the reusable ci.yml for THIS sha (static,
#                     db, e2e-pwa; the dev-server e2e is manual only, e2e-full.yml); `build` runs in
#                     parallel; `migrate-and-deploy-prod` needs both and sits behind the
#                     `production` GitHub Environment (a required reviewer), in the order
#                     migrations -> migrate Job -> API -> worker. Pipeline description: docs/deploy/ci.md.
#
# Database per tenant (09.2-16, D-544, D-12, D-18): `supabase db push` still migrates project 0 (the CLI
# path is proven), then ONE Cloud Run Job named `migrate` runs the SAME image digest as the services with
# ROLE=migrate (answer A-16-1: a Job, not a tagged revision). It fans the central set and every tenant set
# out to the hosted tenant projects from inside GCP, so no sealed credential leaves it. The step that executes
# it WAITS (`gcloud run jobs execute --wait`) and fails the deploy on a non-zero execution: a central-set
# failure (exit 1) therefore stops the deploy before any new API or worker revision exists, while one failing
# tenant project is a warning (exit 0, `--strict` is not passed, D-545) and never blocks the others. The Job
# has no listener and no ingress. Its steps and the two services' are kept adjacent and in this order by
# scripts/check-workflows.sh (CI static job).
#
# Release secrets (09.2-16): the preflight step lists, before any migration, every missing item: the GitHub
# environment variable SUPABASE_ORG_SLUG and the Secret Manager secrets `platform-master-keys-prod`
# (PLATFORM_MASTER_KEYS), `migration-database-url-prod` (MIGRATION_DATABASE_URL, the central project's
# `postgres` session URL) and `resend-smtp-pass-prod` (PROJECT_AUTH_SMTP_PASS). They must exist BEFORE the push
# that triggers this deploy, and the runtime service account must be able to read them. Both services run
# PROJECT_PROVIDER=supabase: assertProductionEnv refuses the fake provider in production.
#
# A direct admin push to `master` cannot skip the gate: the production job needs both `checks` and
# `build`, so branch protection is a convenience, not the safety mechanism.
name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - apps/api/**
      - packages/**
      - supabase/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: southamerica-east1
  AR_REPO: rede-social

jobs:
  # The reusable ci.yml for the exact `master` SHA that feeds the production gate. deploy-hml.yml
  # calls the same file for `homolog`, and ci.yml has no push trigger, so this is the only run a
  # push to master starts (pull requests run ci.yml directly).
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push the image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compute the image reference
        id: image
        run: echo "ref=${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fallback if the GitHub plan blocks protected environments on a private repo (RESEARCH §Pitfall 5,
  # Open Question 1): delete the `environment:` block below and replace the `push` trigger for this
  # job with a manual dispatch — the manual run IS the approval. Keep `needs: [checks, build]`.
  #   on:
  #     workflow_dispatch:
  #       inputs:
  #         sha: { description: "master SHA to deploy", required: true }
  migrate-and-deploy-prod:
    name: Production (migrations -> migrate job -> API -> worker)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [checks, build]
    # Never cancel: a cancelled run could abort a migration halfway, so two production deploys queue. Only this
    # job is serialised: `checks` and `build` of a newer push start at once, never waiting behind another run.
    concurrency:
      group: deploy-prod-serial
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rede-social-woad.vercel.app
    steps:
      - uses: actions/checkout@v7

      # Moved before the migrations (09.2-16): the preflight reads Secret Manager and the migrate Job is
      # deployed and executed with this identity.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      # Fails once, before any migration, naming EVERY missing release item (P55, T-09.2-81). Reads names
      # only, never a secret value.
      - name: Release preflight
        env:
          SUPABASE_ORG_SLUG: ${{ vars.SUPABASE_ORG_SLUG }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash scripts/check-release-env.sh --env prod

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # supabase/config.toml has `signing_keys_path = "./signing_keys.json"` (a git-ignored file that only
      # the local stack uses) and the CLI reads config.toml before ANY command, even a remote one: on a
      # fresh runner it fails with "failed to read signing keys: NotFound". The real keys live in the
      # hosted project (JWKS), so an empty set is enough here (same trick as .github/actions/local-stack).
      - name: Empty signing-keys file for the CLI (config.toml references it)
        run: echo '[]' > supabase/signing_keys.json

      # quick 261022-fku: [remotes.production.auth.email.smtp] in supabase/config.toml reads its password
      # through env(RESEND_SMTP_PASS). A GitHub secret that does not exist resolves to an empty string, which
      # would push an enabled SMTP block with no password, so fail here, before the migrations, instead.
      - name: Require the auth SMTP password
        env:
          RESEND_SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
        run: |
          if [ -z "$RESEND_SMTP_PASS" ]; then
            echo "::error::GitHub environment secret RESEND_SMTP_PASS is not set on the production environment. Create it, then re-run this job (docs/deploy/auth-mail.md, Production e-mail rate limit)."
            exit 1
          fi

      # Every Supabase CLI command validates config.toml's `[auth.hook.send_email]` block, so each
      # step that runs the CLI needs SEND_EMAIL_HOOK_SECRETS (same value as Secret Manager).
      - name: Migrations (roles included)
        env:
          SEND_EMAIL_HOOK_SECRETS: ${{ secrets.SEND_EMAIL_HOOK_SECRETS }}
          # The production remote table reads its SMTP password through env() (quick 261022-fku).
          RESEND_SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-roles

      - name: Set the api_user password
        env:
          PGPASSWORD_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
        # psql substitutes :'pw' only in stdin/-f input, never in -c.
        run: echo "alter role api_user with login password :'pw';" | psql "$PGPASSWORD_URL" -v ON_ERROR_STOP=1 -v pw="$API_DB_PASSWORD"

      # 09.1-18 (PAY-28, WR-02, T-09.1-85): `config push` sends every [auth] value of a [remotes.*] table,
      # and a remote inherits the base hook blocks (enabled locally). The guard fails the deploy, before
      # anything is pushed, when a remote lacks its two explicit hook blocks or when an enabled hook points
      # at a function no migration defines (GoTrue would answer 500 on every login). It reads the repo
      # only; enabling a production hook stays a human commit (docs/DEPLOY.md "Phase 09.1 release").
      - name: Auth hook guard
        run: bash scripts/guard-auth-hooks.sh

      - name: Push auth configuration (Send Email Hook -> API)
        env:
          SEND_EMAIL_HOOK_SECRETS: ${{ secrets.SEND_EMAIL_HOOK_SECRETS }}
          # The production remote table reads its SMTP password through env() (quick 261022-fku).
          RESEND_SMTP_PASS: ${{ secrets.RESEND_SMTP_PASS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      # No seeding here, ever — production holds only the super_admin, created once by hand on
      # 2026-09-28; never run `pnpm db:seed` against production (it creates the demo tenants). See
      # docs/DEPLOY.md "Decisions (2026-09-28)".

      # The fan-out (09.2-16, D-544): the central set, then every tenant set on every ready project (project 0
      # included; the runner only records its state when the CLI above already applied it). The Job reads the
      # sealed credentials through the platform keyring, so it carries the same secrets as the services plus
      # MIGRATION_DATABASE_URL. assertProductionEnv runs in this process too (NODE_ENV=production in the
      # image), so the payments pair and API_PUBLIC_URL are listed like on the services. Secrets are mounted
      # by name from Secret Manager, never in env_vars. `--max-retries=0`: a failed execution is reported, not
      # re-run by Cloud Run; the worker's retry job heals a behind tenant project later.
      - name: Deploy the migrate job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: migrate
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=migrate
            LOG_LEVEL=info
            PLATFORM_HOST=rede-social-woad.vercel.app
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
            API_PUBLIC_URL=https://api-253040968821.southamerica-east1.run.app
            PAYMENTS_PROVIDERS=kiwify
          secrets: |-
            DATABASE_URL=api-database-url-prod:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest
            SUPABASE_URL=supabase-url-prod:latest
            MIGRATION_DATABASE_URL=migration-database-url-prod:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-prod:latest
            SUPABASE_PAT=supabase-pat-prod:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-prod:latest
          flags: --service-account=${{ vars.RUNTIME_SA }} --max-retries=0 --task-timeout=3600s

      # Waits for the execution and fails the step on a non-zero exit (central set failed). The Job prints
      # ids, counts and fixed failure codes only (09.2-15); the step summary links nothing secret.
      - name: Run the migrate job
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set +e
          gcloud run jobs execute migrate --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
          code=$?
          set -e
          execution="$(gcloud run jobs executions list --job migrate --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit=1 --format='value(name)' 2>/dev/null || true)"
          {
            echo "### Migrate job"
            echo "- execution: \`${execution:-unknown}\`"
            echo "- exit code: $code"
            echo "- logs: Cloud Run > Jobs > migrate > Executions (one JSON line per project, no credential)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::The migrate job failed (exit $code). No new API or worker revision was deployed."
            exit "$code"
          fi

      # Web Push (07-06, 07-11): both services run the `webpush` transport with the three VAPID
      # secrets. The worker sends; the API only enqueues, but it validates subscription endpoints
      # (the fake push host is refused only under webpush) and boots the same assertProductionEnv.
      # The secrets must exist BEFORE this runs: a missing one fails the deploy (docs/DEPLOY.md
      # "Phase 7 release", step 2).
      #
      # Payments (09.1-05, 09.1-18, D-486): both services list ONE real gateway adapter in PAYMENTS_PROVIDERS
      # and mount PAYMENTS_SECRET_KEY (32 random bytes, base64) from Secret Manager; assertProductionEnv
      # refuses to boot without the key once a real gateway is listed. The secret `payments-secret-key-prod`
      # must exist BEFORE the push that triggers this deploy (docs/DEPLOY.md "Phase 09.1 release"). The test
      # adapter is NEVER listed here: its signature is a plain HMAC anyone could forge. API_PUBLIC_URL is the
      # API's public origin, so the webhook URL the Pagamentos screen shows is not an internal Cloud Run host.
      #
      # Custom domains (TENANT-07, D-34, quick 261021-eks): both services run the real `vercel` domain adapter
      # and the `supabase` auth allow-list adapter (the worker runs the verify poller and the boot-time
      # allow-list reconcile, the API answers "Verificar agora"). The project id, team id and Supabase ref are
      # literals here, like PLATFORM_HOST and API_PUBLIC_URL (the hml workflow reads GitHub environment
      # variables and needs a preflight because a missing value there falls back to a production value; a
      # literal in this reviewed file has no fallback). The secrets `vercel-token-prod` and `supabase-pat-prod`
      # must exist in api-dere-social and be readable by the runtime service account BEFORE the push that
      # triggers this deploy: assertProductionEnv refuses to boot without them and Cloud Run fails a revision
      # whose secret is missing (and that failure lands after the migrations and the auth configuration are
      # applied). deploy-cloudrun merges env_vars and secrets into the live service by default, so values set
      # by hand survive. See docs/DEPLOY.md "Custom domains".
      - name: Deploy the API
        uses: google-github-actions/deploy-cloudrun@v3
        id: api
        with:
          service: api
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=api
            LOG_LEVEL=info
            PLATFORM_HOST=rede-social-woad.vercel.app
            VIDEO_PROVIDER=mux
            MAIL_TRANSPORT=resend
            MAIL_DOMAIN=n1marketingdigital.com.br
            PUSH_TRANSPORT=webpush
            DOMAIN_PROVIDER=vercel
            VERCEL_PROJECT_ID=prj_oPNJ2NKXw4j2RkAN4gtC8vbmqyZa
            VERCEL_TEAM_ID=team_Nf4Qex49TkN0pmqTt4iuKNGU
            AUTH_ALLOW_LIST=supabase
            SUPABASE_PROJECT_REF=qjjhtduxquvlfppybpqq
            PAYMENTS_PROVIDERS=kiwify
            API_PUBLIC_URL=https://api-253040968821.southamerica-east1.run.app
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
          secrets: |-
            DATABASE_URL=api-database-url-prod:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest
            SUPABASE_URL=supabase-url-prod:latest
            MUX_TOKEN_ID=mux-token-id-prod:latest
            MUX_TOKEN_SECRET=mux-token-secret-prod:latest
            MUX_SIGNING_KEY_ID=mux-signing-key-id-prod:latest
            MUX_SIGNING_KEY_PRIVATE=mux-signing-key-private-prod:latest
            MUX_WEBHOOK_SECRET=mux-webhook-secret-prod:latest
            VAPID_PUBLIC_KEY=vapid-public-key-prod:latest
            VAPID_PRIVATE_KEY=vapid-private-key-prod:latest
            VAPID_SUBJECT=vapid-subject-prod:latest
            RESEND_API_KEY=resend-api-key-prod:latest
            SEND_EMAIL_HOOK_SECRETS=send-email-hook-secrets-prod:latest
            VERCEL_TOKEN=vercel-token-prod:latest
            SUPABASE_PAT=supabase-pat-prod:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-prod:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-prod:latest
            PROJECT_AUTH_SMTP_PASS=resend-smtp-pass-prod:latest
          # Public without an allUsers binding: the org policy iam.allowedPolicyMemberDomains
          # (Domain restricted sharing) refuses allUsers, so --allow-unauthenticated cannot be used.
          # --max-instances=20: the regional CPU quota of api-dere-social in southamerica-east1
          # (CpuAllocPerProjectRegion, 20 vCPU) refuses 25 ("Max instances must be set to 20 or
          # fewer"). Lowering the cap only reduces connections, so the docs/DEPLOY.md "Connection
          # budget (Pro)" stays satisfied; raising it back needs a quota increase first, and a
          # recompute there before changing it or DATABASE_POOL_MAX.
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=1 --max-instances=20 --no-invoker-iam-check --port=8080

      - name: Deploy the worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: worker
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=worker
            LOG_LEVEL=info
            PLATFORM_HOST=rede-social-woad.vercel.app
            VIDEO_PROVIDER=mux
            MAIL_TRANSPORT=resend
            MAIL_DOMAIN=n1marketingdigital.com.br
            PUSH_TRANSPORT=webpush
            DOMAIN_PROVIDER=vercel
            VERCEL_PROJECT_ID=prj_oPNJ2NKXw4j2RkAN4gtC8vbmqyZa
            VERCEL_TEAM_ID=team_Nf4Qex49TkN0pmqTt4iuKNGU
            AUTH_ALLOW_LIST=supabase
            SUPABASE_PROJECT_REF=qjjhtduxquvlfppybpqq
            PAYMENTS_PROVIDERS=kiwify
            DATABASE_POOL_MAX=10
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
            API_PUBLIC_URL=https://api-253040968821.southamerica-east1.run.app
          secrets: |-
            DATABASE_URL=api-database-url-prod:latest
            BOSS_DATABASE_URL=worker-database-url-prod:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-prod:latest
            SUPABASE_URL=supabase-url-prod:latest
            MUX_TOKEN_ID=mux-token-id-prod:latest
            MUX_TOKEN_SECRET=mux-token-secret-prod:latest
            MUX_SIGNING_KEY_ID=mux-signing-key-id-prod:latest
            MUX_SIGNING_KEY_PRIVATE=mux-signing-key-private-prod:latest
            MUX_WEBHOOK_SECRET=mux-webhook-secret-prod:latest
            VAPID_PUBLIC_KEY=vapid-public-key-prod:latest
            VAPID_PRIVATE_KEY=vapid-private-key-prod:latest
            VAPID_SUBJECT=vapid-subject-prod:latest
            RESEND_API_KEY=resend-api-key-prod:latest
            SEND_EMAIL_HOOK_SECRETS=send-email-hook-secrets-prod:latest
            VERCEL_TOKEN=vercel-token-prod:latest
            SUPABASE_PAT=supabase-pat-prod:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-prod:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-prod:latest
            PROJECT_AUTH_SMTP_PASS=resend-smtp-pass-prod:latest
            MIGRATION_DATABASE_URL=migration-database-url-prod:latest
          # --max-instances=1 and DATABASE_POOL_MAX=10 (worker only): docs/DEPLOY.md "Connection budget
          # (Pro)" (4 push-send jobs at a time plus every other queue); recompute there before changing.
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=1 --max-instances=1 --no-cpu-throttling --no-allow-unauthenticated

      - name: Deep health check
        run: curl -fsS "${{ steps.api.outputs.url }}/v1/health?deep=1"
