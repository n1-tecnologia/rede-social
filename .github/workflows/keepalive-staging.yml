# Supabase Free projects pause after a week without activity (RESEARCH §Pitfall 4, A9). `deep=1` runs
# `select 1` through api_user, so the ping is real database activity and resets the timer. Twice a
# week (Mon/Thu 09:00 UTC) leaves a wide margin.
name: Keep staging awake

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: GET /v1/health?deep=1 on api-staging
    runs-on: ubuntu-latest
    steps:
      - name: Deep health check
        run: curl -fsS --retry 3 --retry-delay 10 "${{ vars.API_STAGING_URL }}/v1/health?deep=1"
