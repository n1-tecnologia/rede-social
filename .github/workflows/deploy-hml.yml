# Homolog (hml): API + worker to Cloud Run in the isolated hml GCP project (quick 261002-f4y).
#
# Homolog is fully isolated from production: its own GCP project (`rede-social-hml`), its own
# Supabase project and its own Vercel project (`rede-social-hml`). See docs/DEPLOY.md
# "Decisions (2026-10-02)".
#
#   push to homolog -> `checks` (the same reusable ci.yml as production, for THIS sha) in parallel
#                      with `build` (preflight + image), then `migrate-and-deploy-hml` needs both
#                      (migrations -> migrate Job -> API -> worker), automatically, with NO reviewer.
#
# The pipeline is symmetric (quick 261007-kbq): deploy-api.yml (master) and this file both call
# ci.yml as `checks`, and ci.yml has no push trigger of its own, so a push to homolog starts only this
# workflow and the suite never runs twice. The e2e inside `checks` runs only the specs the change can
# affect (docs/deploy/ci.md). `checks` needs no cloud credential and is given none. A manual
# workflow_dispatch has no push base, so its `checks` run the full suite.
#
# Isolation guards, outermost last:
#   1. Both jobs declare `environment: homolog`; its variables and secrets override the
#      repository-level (production) values of the same names.
#   2. The preflight (first step of `build`, before any credential is used) refuses an empty value,
#      any value that resolves to production, and a supabase/config.toml without a
#      `[remotes.homolog]` table bound to the hml Supabase ref.
#   3. The WIF provider attribute conditions: the hml provider accepts only `refs/heads/homolog`
#      and the production provider only `refs/heads/master` (docs/DEPLOY.md "Workload Identity
#      branch restriction (isolation guard)").
#
# Supabase mode (GitHub environment variable HML_SUPABASE on `homolog`):
#   isolated                 -> the only accepted value: the hml Supabase project; migrations, api_user,
#                               config push, the migrate Job and the worker all run, and every
#                               production-value guard applies.
#   shared-with-production   -> REFUSED by the preflight since 09.2-16 (A-16-2). Both services now run
#                               PROJECT_PROVIDER=supabase (a production-mode process cannot run the fake
#                               provider), so a homolog that shares production's database would have to hold a
#                               project-provider token and run the fan-out against production data. Homolog
#                               must be isolated before it can rehearse moves (hml provisioning runbook,
#                               docs/DEPLOY.md; the hml project and its secrets are plan 09.2-25's gate).
# Anything else fails the preflight.
#
# Database per tenant (09.2-16, D-544): the same sequence as deploy-api.yml: `supabase db push` for project 0,
# then the Cloud Run Job `migrate-hml` on the SAME image digest as the services (ROLE=migrate), executed with
# `--wait` before the API and the worker. Release secrets (preflight step, names only, before any migration):
# the GitHub environment variable SUPABASE_ORG_SLUG and the Secret Manager secrets platform-master-keys-hml,
# migration-database-url-hml and resend-smtp-pass-hml. scripts/check-workflows.sh guards the order.
#
# No seed step: production's never-seed rule does not apply to hml, but a demo seed there is run by
# hand only, never from a workflow (docs/DEPLOY.md "hml provisioning runbook").
name: Deploy homolog (hml)

on:
  push:
    branches: [homolog]
    paths:
      - apps/api/**
      - packages/**
      - supabase/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-hml.yml
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: southamerica-east1
  AR_REPO: rede-social

jobs:
  # The reusable ci.yml for the exact `homolog` SHA that feeds the deploy gate, the same call as
  # deploy-api.yml. No `with`, no `secrets`, no `environment`, no `permissions` override: it needs no
  # cloud credential, and ci.yml's `permissions: contents: read` caps it (no id-token). The same ref
  # guard as `build`: a dispatch from another branch skips it instead of failing at WIF.
  checks:
    if: github.ref == 'refs/heads/homolog'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and push the image (hml)
    # A workflow_dispatch from any other branch is skipped here instead of failing at WIF.
    if: github.ref == 'refs/heads/homolog'
    runs-on: ubuntu-latest
    environment: homolog
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      # Values arrive only through env (no expression inside `run`). Never prints the Supabase ref.
      # Read-only: it never edits supabase/config.toml.
      - name: Preflight — refuse production values and a missing hml remote
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SA: ${{ vars.DEPLOY_SA }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          PLATFORM_HOST: ${{ vars.PLATFORM_HOST }}
          WEB_URL: ${{ vars.WEB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          HML_SUPABASE: ${{ vars.HML_SUPABASE }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          case "$HML_SUPABASE" in
            isolated) ;;
            shared-with-production)
              fail "HML_SUPABASE=shared-with-production is refused since the database-per-tenant release (A-16-2): both services run PROJECT_PROVIDER=supabase, and a homolog that shares production's database would have to hold a project-provider token and run the fan-out against production data. Make homolog isolated first (docs/DEPLOY.md, hml provisioning runbook; plan 09.2-25)." ;;
            *) fail "HML_SUPABASE must be 'isolated' on environment 'homolog' ('shared-with-production' is refused)." ;;
          esac

          # (a) Every homolog value is present.
          names="WIF_PROVIDER DEPLOY_SA RUNTIME_SA GCP_PROJECT_ID PLATFORM_HOST WEB_URL VERCEL_PROJECT_ID VERCEL_TEAM_ID SUPABASE_PROJECT_REF API_PUBLIC_URL SUPABASE_PROJECT_ID"
          for name in $names; do
            if [ -z "${!name:-}" ]; then
              fail "$name is empty: define it on the GitHub environment 'homolog' (docs/DEPLOY.md)."
            fi
          done

          # (b) GCP identifiers are not production's (a missing environment value falls back to the
          # repository-level production variable).
          if [ "$GCP_PROJECT_ID" = "api-dere-social" ]; then
            fail "GCP_PROJECT_ID is the production project; set the hml project on environment 'homolog'."
          fi
          case "$WIF_PROVIDER" in
            projects/253040968821/*) fail "WIF_PROVIDER is the production provider; set the hml provider on environment 'homolog'." ;;
          esac
          for name in DEPLOY_SA RUNTIME_SA; do
            case "${!name}" in
              *@api-dere-social.iam.gserviceaccount.com) fail "$name is a production service account; set the hml one on environment 'homolog'." ;;
            esac
          done

          # Tenant domains attach to the hml Vercel project, never to production's: an hml attach on
          # the production project would route a tenant's real host to whichever code it chose.
          if [ "$VERCEL_PROJECT_ID" = "prj_oPNJ2NKXw4j2RkAN4gtC8vbmqyZa" ]; then
            fail "VERCEL_PROJECT_ID is the production Vercel project; set the rede-social-hml project on environment 'homolog'."
          fi

          # The hml API's public origin is not production's (a webhook URL pointing at production would
          # send a tenant's gateway deliveries to the wrong environment).
          case "$API_PUBLIC_URL" in
            *api-253040968821.southamerica-east1.run.app*) fail "API_PUBLIC_URL is the production API origin; set the hml API origin on environment 'homolog'." ;;
          esac

          # (c) The Supabase ref is not production's (hml is always an isolated Supabase project now).
          if [ "$SUPABASE_PROJECT_ID" = "qjjhtduxquvlfppybpqq" ]; then
            fail "SUPABASE_PROJECT_ID is the production Supabase project; set the hml ref on environment 'homolog'."
          fi
          # The auth allow-list writer must edit the project hml actually logs in against.
          if [ "$SUPABASE_PROJECT_REF" != "$SUPABASE_PROJECT_ID" ]; then
            fail "SUPABASE_PROJECT_REF must equal the hml SUPABASE_PROJECT_ID once hml is isolated."
          fi

          # (d) The web host is not production's.
          if [ "$PLATFORM_HOST" = "rede-social-woad.vercel.app" ]; then
            fail "PLATFORM_HOST is the production host; set the hml host on environment 'homolog'."
          fi
          case "$WEB_URL" in
            *rede-social-woad.vercel.app*) fail "WEB_URL points at the production host; set the hml URL on environment 'homolog'." ;;
          esac

          # (e) supabase/config.toml has a [remotes.homolog] table bound to the hml ref. Without it,
          # `supabase config push` would push the LOCAL [auth] values to the hml project.
          missing_remote="supabase/config.toml has no [remotes.homolog] table whose project_id equals SUPABASE_PROJECT_ID. Add the [remotes.homolog] override (project_id, site_url, the explicit /auth/confirm** redirect entry, the send_email hook uri on the hml api) before the first hml deploy: without it, supabase config push would push the local [auth] values to the hml project."
          if [ ! -f supabase/config.toml ] || ! grep -Eq '^\[remotes\.homolog\][[:space:]]*$' supabase/config.toml; then
            fail "$missing_remote"
          fi
          remote_ref="$(awk '
            /^\[remotes\.homolog\][ \t]*$/ { inside = 1; next }
            inside && /^\[/ { exit }
            inside && /^[ \t]*project_id[ \t]*=/ {
              if (match($0, /"[^"]*"/)) print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ' supabase/config.toml)"
          if [ -z "$remote_ref" ] || [ "$remote_ref" != "$SUPABASE_PROJECT_ID" ]; then
            fail "$missing_remote"
          fi

          echo "Preflight passed: homolog values present, none resolves to production, [remotes.homolog] matches."

      - uses: google-github-actions/auth@v3
        id: auth
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compute the image reference
        id: image
        run: echo "ref=${GCP_REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${AR_REPO}/api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-and-deploy-hml:
    name: Homolog (migrations -> migrate job -> API -> worker)
    if: github.ref == 'refs/heads/homolog'
    # Never cancel: a cancelled run could abort a migration halfway, so two homolog deploys queue. Only this
    # job is serialised: `checks` and `build` of a newer push start at once, never waiting behind another run.
    concurrency:
      group: deploy-hml-serial
      cancel-in-progress: false
    # The same gate as production (deploy-api.yml): the reusable `checks` and the image build.
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment:
      name: homolog
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7

      # Before the migrations (09.2-16): the preflight reads Secret Manager and the migrate Job is deployed
      # and executed with this identity.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      # Fails once, before any migration, naming EVERY missing release item (P55, T-09.2-81).
      - name: Release preflight
        env:
          SUPABASE_ORG_SLUG: ${{ vars.SUPABASE_ORG_SLUG }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: bash scripts/check-release-env.sh --env hml

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      # supabase/config.toml has `signing_keys_path = "./signing_keys.json"` (a git-ignored file that only
      # the local stack uses) and the CLI reads config.toml before ANY command, even a remote one: on a
      # fresh runner it fails with "failed to read signing keys: NotFound". The real keys live in the
      # hosted project (JWKS), so an empty set is enough here (same trick as .github/actions/local-stack).
      - name: Empty signing-keys file for the CLI (config.toml references it)
        run: echo '[]' > supabase/signing_keys.json

      # Every Supabase CLI command validates config.toml's `[auth.hook.send_email]` block, so each
      # step that runs the CLI needs SEND_EMAIL_HOOK_SECRETS (same value as Secret Manager).
      - name: Migrations (roles included)
        env:
          SEND_EMAIL_HOOK_SECRETS: ${{ secrets.SEND_EMAIL_HOOK_SECRETS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-roles

      - name: Set the api_user password
        env:
          PGPASSWORD_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          API_DB_PASSWORD: ${{ secrets.API_DB_PASSWORD }}
        # psql substitutes :'pw' only in stdin/-f input, never in -c.
        run: echo "alter role api_user with login password :'pw';" | psql "$PGPASSWORD_URL" -v ON_ERROR_STOP=1 -v pw="$API_DB_PASSWORD"

      # 09.1-18 (PAY-28, WR-02, T-09.1-85): a [remotes.*] table inherits the base hook blocks (enabled locally); the
      # guard fails the run when a remote lacks its two explicit hook blocks or when an enabled hook points
      # at a function no migration defines. It reads the repo only and enables nothing.
      - name: Auth hook guard
        run: bash scripts/guard-auth-hooks.sh

      - name: Push auth configuration (Send Email Hook -> API)
        env:
          SEND_EMAIL_HOOK_SECRETS: ${{ secrets.SEND_EMAIL_HOOK_SECRETS }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase config push --project-ref "$SUPABASE_PROJECT_ID" --yes

      # No seeding here. A demo seed on hml is allowed, but it is run by hand (docs/DEPLOY.md
      # "hml provisioning runbook"), never from a workflow. Production's never-seed rule is unchanged.

      # The fan-out (09.2-16, D-544): the same Job as production under the hml names and secrets. See
      # deploy-api.yml for the reasoning (same image digest, `--wait`, secrets mounted by name, the
      # assertProductionEnv-driven API_PUBLIC_URL and payments pair). MAIL_DOMAIN and PROJECT_AUTH_SMTP_PASS
      # are for the tenant move (`ROLE=move` on this same Job, 09.2-24), whose target bootstrap needs them.
      - name: Deploy the migrate job
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          job: migrate-hml
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=migrate
            LOG_LEVEL=info
            PLATFORM_HOST=${{ vars.PLATFORM_HOST }}
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
            PAYMENTS_PROVIDERS=kiwify
            MAIL_DOMAIN=n1marketingdigital.com.br
          secrets: |-
            DATABASE_URL=api-database-url-hml:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-hml:latest
            SUPABASE_URL=supabase-url-hml:latest
            MIGRATION_DATABASE_URL=migration-database-url-hml:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-hml:latest
            SUPABASE_PAT=supabase-pat-hml:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-hml:latest
            PROJECT_AUTH_SMTP_PASS=resend-smtp-pass-hml:latest
          flags: --service-account=${{ vars.RUNTIME_SA }} --max-retries=0 --task-timeout=3600s

      - name: Run the migrate job
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set +e
          gcloud run jobs execute migrate-hml --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait
          code=$?
          set -e
          execution="$(gcloud run jobs executions list --job migrate-hml --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --limit=1 --format='value(name)' 2>/dev/null || true)"
          {
            echo "### Migrate job (hml)"
            echo "- execution: \`${execution:-unknown}\`"
            echo "- exit code: $code"
            echo "- logs: Cloud Run > Jobs > migrate-hml > Executions (one JSON line per project, no credential)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "::error::The migrate job failed (exit $code). No new API or worker revision was deployed."
            exit "$code"
          fi

      # Web Push (07-06, 07-11): both services run the `webpush` transport with the three VAPID
      # secrets (the hml pair, never production's). The worker sends; the API only enqueues, but it
      # validates subscription endpoints and boots the same assertProductionEnv. Every `-hml` secret
      # must exist in `rede-social-hml` BEFORE the first run: a missing one fails the deploy
      # (docs/DEPLOY.md "GCP Secret Manager secrets — `homolog`").
      #
      # Payments (09.1-05, 09.1-18, D-486): both services list ONE real gateway adapter in PAYMENTS_PROVIDERS
      # (the test adapter is NEVER listed: its signature is a plain HMAC anyone could forge) and mount
      # PAYMENTS_SECRET_KEY from `payments-secret-key-hml`, which must exist BEFORE the push that triggers
      # this deploy. API_PUBLIC_URL (environment variable, checked by the
      # preflight) is the hml API's public origin for the webhook URL the Pagamentos screen shows.
      - name: Deploy the API
        uses: google-github-actions/deploy-cloudrun@v3
        id: api
        with:
          service: api
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=api
            LOG_LEVEL=info
            PLATFORM_HOST=${{ vars.PLATFORM_HOST }}
            VIDEO_PROVIDER=mux
            MAIL_TRANSPORT=resend
            MAIL_DOMAIN=n1marketingdigital.com.br
            PUSH_TRANSPORT=webpush
            DOMAIN_PROVIDER=vercel
            VERCEL_PROJECT_ID=${{ vars.VERCEL_PROJECT_ID }}
            VERCEL_TEAM_ID=${{ vars.VERCEL_TEAM_ID }}
            AUTH_ALLOW_LIST=supabase
            SUPABASE_PROJECT_REF=${{ vars.SUPABASE_PROJECT_REF }}
            PAYMENTS_PROVIDERS=kiwify
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
          secrets: |-
            DATABASE_URL=api-database-url-hml:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-hml:latest
            SUPABASE_URL=supabase-url-hml:latest
            MUX_TOKEN_ID=mux-token-id-hml:latest
            MUX_TOKEN_SECRET=mux-token-secret-hml:latest
            MUX_SIGNING_KEY_ID=mux-signing-key-id-hml:latest
            MUX_SIGNING_KEY_PRIVATE=mux-signing-key-private-hml:latest
            MUX_WEBHOOK_SECRET=mux-webhook-secret-hml:latest
            VAPID_PUBLIC_KEY=vapid-public-key-hml:latest
            VAPID_PRIVATE_KEY=vapid-private-key-hml:latest
            VAPID_SUBJECT=vapid-subject-hml:latest
            RESEND_API_KEY=resend-api-key-hml:latest
            SEND_EMAIL_HOOK_SECRETS=send-email-hook-secrets-hml:latest
            VERCEL_TOKEN=vercel-token-hml:latest
            SUPABASE_PAT=supabase-pat-hml:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-hml:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-hml:latest
            PROJECT_AUTH_SMTP_PASS=resend-smtp-pass-hml:latest
          # Public without an allUsers binding: the org policy iam.allowedPolicyMemberDomains
          # (Domain restricted sharing) refuses allUsers, so --allow-unauthenticated cannot be used.
          # --min-instances=0: hml tolerates a cold start; the deep health check below retries.
          # --max-instances=2: hml is isolated, so its api counts against its own Supavisor budget only.
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=0 --max-instances=2 --no-invoker-iam-check --port=8080

      - name: Deploy the worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: worker
          region: ${{ env.GCP_REGION }}
          image: ${{ needs.build.outputs.image }}
          env_vars: |-
            ROLE=worker
            LOG_LEVEL=info
            PLATFORM_HOST=${{ vars.PLATFORM_HOST }}
            VIDEO_PROVIDER=mux
            MAIL_TRANSPORT=resend
            MAIL_DOMAIN=n1marketingdigital.com.br
            PUSH_TRANSPORT=webpush
            DOMAIN_PROVIDER=vercel
            VERCEL_PROJECT_ID=${{ vars.VERCEL_PROJECT_ID }}
            VERCEL_TEAM_ID=${{ vars.VERCEL_TEAM_ID }}
            AUTH_ALLOW_LIST=supabase
            SUPABASE_PROJECT_REF=${{ vars.SUPABASE_PROJECT_REF }}
            PAYMENTS_PROVIDERS=kiwify
            DATABASE_POOL_MAX=10
            PROJECT_PROVIDER=supabase
            SUPABASE_ORG_SLUG=${{ vars.SUPABASE_ORG_SLUG }}
            API_PUBLIC_URL=${{ vars.API_PUBLIC_URL }}
          secrets: |-
            DATABASE_URL=api-database-url-hml:latest
            BOSS_DATABASE_URL=worker-database-url-hml:latest
            SUPABASE_SERVICE_KEY=supabase-service-key-hml:latest
            SUPABASE_URL=supabase-url-hml:latest
            MUX_TOKEN_ID=mux-token-id-hml:latest
            MUX_TOKEN_SECRET=mux-token-secret-hml:latest
            MUX_SIGNING_KEY_ID=mux-signing-key-id-hml:latest
            MUX_SIGNING_KEY_PRIVATE=mux-signing-key-private-hml:latest
            MUX_WEBHOOK_SECRET=mux-webhook-secret-hml:latest
            VAPID_PUBLIC_KEY=vapid-public-key-hml:latest
            VAPID_PRIVATE_KEY=vapid-private-key-hml:latest
            VAPID_SUBJECT=vapid-subject-hml:latest
            RESEND_API_KEY=resend-api-key-hml:latest
            SEND_EMAIL_HOOK_SECRETS=send-email-hook-secrets-hml:latest
            VERCEL_TOKEN=vercel-token-hml:latest
            SUPABASE_PAT=supabase-pat-hml:latest
            PAYMENTS_SECRET_KEY=payments-secret-key-hml:latest
            PLATFORM_MASTER_KEYS=platform-master-keys-hml:latest
            PROJECT_AUTH_SMTP_PASS=resend-smtp-pass-hml:latest
            MIGRATION_DATABASE_URL=migration-database-url-hml:latest
          # pg-boss needs a warm worker: min 1 and CPU always allocated, as in production.
          # --max-instances=1 and DATABASE_POOL_MAX=10 mirror production (docs/DEPLOY.md "Connection
          # budget (Pro)").
          flags: --service-account=${{ vars.RUNTIME_SA }} --min-instances=1 --max-instances=1 --no-cpu-throttling --no-allow-unauthenticated

      # The api scales to zero on hml, so the first request may hit a cold start: retry.
      - name: Deep health check
        env:
          API_URL: ${{ steps.api.outputs.url }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$API_URL/v1/health?deep=1"
